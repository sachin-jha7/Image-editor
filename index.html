<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-Editor: JavaScript</title>
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.0/css/animations.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <section>


            <div class="left">
                <div class="load-panel">
                    <label class="btn" for="img-inp">Choose Image</label>
                    <input type="file" id="img-inp" accept="image/*" hidden>
                    <button class="btn" id="reset">Reset</button>
                    <button class="btn" id="download">Download</button>
                </div>
                <div class="image-panel">
                    <p>No image choosen</p>
                    <img>
                </div>
            </div>
            <div class="right">
                <h2>Edit Your Image</h2>
                <button class="crop-btn" id="crop-btn">Crop</button>
                <button id="filter-box-btn">Filters</button>
                <div class="filter-btns">
                    <button id="Brightness" class="active">Birghtness</button>
                    <button id="Contrast">Contrast</button>
                    <button id="Saturation">Saturation</button>
                    <button id="hueRotation">hueRotation</button>
                    <button id="Blur">Blur</button>
                    <button id="Grayscale">Grayscale</button>
                    <button id="Sepia">Sepia</button>
                    <button id="Opacity">Opacity</button>
                    <button id="Invert">Invert</button>
                </div>
                <div class="slider-info">
                    <p class="name">Birghtness</p>
                    <p class="value">100%</p>
                </div>
                <input type="range" min="0" max="200" value="100" id="filter">
                <h2>Filters</h2>
                <div class="preset-btns">
                    <div>
                    </div>
                    <button id="normal" class="active-preset">Normal</button>
                    <button id="soft-glow">Soft Glow</button>
                    <button id="noir">Noir</button>
                    <button id="drama">Drama</button>
                    <button id="old-school">Old School</button>
                    <button id="pop">pop</button>
                    <button id="vintage">Vintage</button>
                </div>
            </div>
        </section>
    </div>
    <script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.0/dist/boxicons.js"></script>
    <script src="app.js"></script>
</body>

</html>
